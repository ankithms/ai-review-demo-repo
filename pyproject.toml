[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review-order-service-demo"
version = "0.1.0"
description = "Synthetic in-memory order service for AI code-review demonstrations"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

